  <script type="module" defer>
    const credFile = './scripts/credentials.json'

    globalThis.cred = await (async function loadCred() {
      try {
        // 1. Try the modern Import Attribute way
        const module = await import(credFile, { with: { type: 'json' } })
        return module.default
      } catch (err) {
        // 2. Fallback to fetch() if the above fails or is unsupported
        echo.wrn("Import Attribute failed, trying fetch fallback...", err)
        const response = await fetch(credFile)
        return await response.json()
      }
    })()
  </script>
