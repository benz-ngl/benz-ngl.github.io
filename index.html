  <script type="module">
    const credFile = './scripts/credentials.json'

    globalThis.cred = await (async function loadCred() {
      try {
        // Try the modern Import Attribute way
        const mod = await import(credFile, { with: { type: 'json' } })
        return mod.default
      } catch (err) {
        // Fallback to fetch() if the above fails or is unsupported
        console.warn("Import Attribute failed, trying fetch fallback...", err)
        const res = await fetch(credFile)
        return await res.json()
      }
    })()
  </script>

    }

    globalThis.$prompt = document.querySelector('.prompt')
    globalThis.$html = document.querySelector('html')
    globalThis._prompt = null
    globalThis._tag = null
    
    function render() {
      if (globalThis.tag = location.hash) {
        const entry = prompts[tag] ?? prompts['']
        $prompt.textContent = entry[1]
        $html.style.cssText = entry[2]
      }

      if (params.has('t'))
        globalThis._tag = params.get('t').replaceAll('_', ' ')

      if (params.has('q'))
        $prompt.textContent = globalThis._prompt = params.get('q').replaceAll('_', ' ')

      if (params.has('s'))
        $html.style.cssText = params.get('s')
    }

    window.addEventListener("hashchange", render)
    render()
  </script>
